name: Build ImmortalWrt

on:
  push:
    tags:
      - v**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3000M"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CONFIG_FILE: defconfig/be12-pro.config

    steps:
      - name: Checkout My Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Download Cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-immortalwrt-dl-be12-pro-${{ hashFiles('defconfig/be12-pro.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-be12-pro-
            ${{ runner.os }}-immortalwrt-dl-

      - name: Restore Compiler Cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-be12-pro-${{ github.ref_name }}-${{ hashFiles('defconfig/be12-pro.config') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-be12-pro-${{ github.ref_name }}-${{ hashFiles('defconfig/be12-pro.config') }}-
            ${{ runner.os }}-immortalwrt-ccache-be12-pro-
            ${{ runner.os }}-immortalwrt-ccache-

      - name: Restore Host/Toolchain Cache
        id: host-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-host-toolchain-be12-pro-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-host-toolchain-be12-pro-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-
            ${{ runner.os }}-immortalwrt-host-toolchain-be12-pro-
            ${{ runner.os }}-immortalwrt-host-toolchain-

      - name: Initialize Build Environment
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Prepare Compiler Cache
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

          mkdir -p "${CCACHE_DIR}" dl
          ccache -M "${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone Aurora Theme
        run: |
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora

      - name: Load Configuration
        run: |
          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s|^# ${key} is not set$|${key}=${value}|" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s|^${key}=.*$|${key}=${value}|" .config
            else
              echo "${key}=${value}" >> .config
            fi
          }

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi

          cp -f "$CONFIG_FILE" .config
          echo "✅ Loaded $CONFIG_FILE"

          set_config "CONFIG_CCACHE" "y"

          make defconfig

          echo "📄 Key config:"
          grep -E '^(CONFIG_TARGET_|CONFIG_CCACHE=)' .config || true

      - name: Download Sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Compile Firmware
        run: |
          set -euo pipefail

          ccache --show-stats || true

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s"
            make -j1 V=s
          fi

          ccache --show-stats || true

      - name: Save Compiler Cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save Host/Toolchain Cache
        if: success() && steps.host-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ steps.host-toolchain-cache.outputs.cache-primary-key }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-be12-pro
          path: |
            bin/targets/mediatek/filogic/**/*.bin
            bin/targets/mediatek/filogic/**/*.manifest
            bin/targets/mediatek/filogic/**/sha256sums*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-firmwares

      - name: Flatten and Rename Files
        run: |
          mkdir -p final-release
          for config_dir in all-firmwares/*/; do
            for bin_file in "$config_dir"*.bin; do
              if [ -f "$bin_file" ]; then
                base=$(basename "$bin_file")
                case "$base" in
                  *sysupgrade.bin)
                    cp "$bin_file" "final-release/be12-pro-sysupgrade.bin"
                    ;;
                  *factory.bin)
                    cp "$bin_file" "final-release/be12-pro-factory.bin"
                    ;;
                  *)
                    cp "$bin_file" "final-release/${base}"
                    ;;
                esac
              fi
            done
          done

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: final-release/*.bin
          draft: false
          body: |
            ## 📦 BE12-Pro 固件发布

            ### 🔧 固件信息
            - **设备**: Tenda BE12-Pro
            - **架构**: aarch64_cortex-a53
            - **平台**: mediatek/filogic

            ### 🔑 登录信息
            - **后台地址**: http://192.168.6.1
            - **用户名**: `root`
            - **密码**: `admin`

            ### 📦 预装插件
            - MosDNS（DNS 分流）
            - HomeProxy（代理工具，含 sing-box）
            - Aurora 主题 + 配置
            - Statistics + CPU 频率监控
            - RamFree（一键释放内存）
            - DDNS（含 Cloudflare 支持）
            - WireGuard（VPN 协议）
            - WOL（网络唤醒）

            ### 📥 文件说明
            - `be12-pro-sysupgrade.bin`：sysupgrade 固件
            - `be12-pro-factory.bin`：factory 固件（如存在）
